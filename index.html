<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>惠尔口腔</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: #f5f5f5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            position: relative;
        }
        .msg {
            position: absolute;
            top: 33.3%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }
        .msg p {
            font-size: 17px;
            color: #1a1a1a;
            line-height: 1.8;
            letter-spacing: .3px;
        }
    </style>
</head>
<body>
    <div class="msg">
        <p>您的访问权限已被回收</p>
    </div>
</body>
</html>
